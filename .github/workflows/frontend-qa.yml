name: Frontend quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    name: Lint, types, logic and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm qa:types

      - name: Frontend logic regression tests
        run: pnpm qa:logic

      - name: Production compilation
        run: pnpm build

      - name: Browser viewport and runtime smoke test
        run: |
          set -euo pipefail
          pnpm start > /tmp/amanah-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          node scripts/browser-smoke.mjs

      - name: Save browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amanah-frontend-visual-qa
          path: audit-artifacts/
          if-no-files-found: ignore
          retention-days: 7
